<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  /* ---------- MENU SCREEN ---------- */
  #menu-screen {
    display: flex;
    height: 100vh;
    width: 100vw;
    align-items: center;
    justify-content: space-between;
    padding: 0 6vw;
  }

  .menu-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 40px;
  }

  .title {
    font-size: 9vw;
    font-weight: bold;
    letter-spacing: 6px;
    margin: 0;
    line-height: 1;
    text-shadow: 0 0 25px rgba(255,255,255,0.35);
  }

  .play-btn {
    background: transparent;
    color: #fff;
    border: 3px solid #fff;
    font-family: inherit;
    font-size: 2.2vw;
    letter-spacing: 4px;
    padding: 18px 50px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .play-btn:hover {
    background: #fff;
    color: #000;
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
  }

  .menu-right {
    perspective: 1100px;
    width: 42vw;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 480px;
    height: 340px;
    transform-style: preserve-3d;
    animation: rotateScene 16s linear infinite;
  }

  @keyframes rotateScene {
    from { transform: rotateX(18deg) rotateY(0deg); }
    to   { transform: rotateX(18deg) rotateY(360deg); }
  }

  .court {
    position: absolute;
    inset: 0;
    border: 2px solid rgba(255,255,255,0.25);
    transform: translateZ(0px);
  }
  .court::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 2px dashed rgba(255,255,255,0.2);
  }

  .paddle {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 90px;
    border-radius: 4px;
    background: linear-gradient(135deg, #ffffff 0%, #dcdcdc 40%, #8f8f8f 70%, #ffffff 100%);
    box-shadow:
      0 0 18px rgba(255,255,255,0.85),
      inset 0 0 10px rgba(255,255,255,0.9);
  }
  .paddle-left {
    left: 30px;
    animation: floatLeft 4.5s ease-in-out infinite;
  }
  .paddle-right {
    right: 30px;
    animation: floatRight 3.8s ease-in-out infinite;
  }

  @keyframes floatLeft {
    0%, 100% { transform: translateY(-75%) translateZ(15px); }
    50%      { transform: translateY(-15%) translateZ(15px); }
  }
  @keyframes floatRight {
    0%, 100% { transform: translateY(-20%) translateZ(-15px); }
    50%      { transform: translateY(-80%) translateZ(-15px); }
  }

  .ball {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffffff 25%, #cfcfcf 55%, #6f6f6f 100%);
    box-shadow: 0 0 22px rgba(255,255,255,0.9);
    animation: ballMove 9s ease-in-out infinite;
  }

  @keyframes ballMove {
    0%   { transform: translate(-430%, -50%) translateZ(0px); }
    22%  { transform: translate(-120%, -120%) translateZ(40px); }
    50%  { transform: translate(400%, -50%) translateZ(0px); }
    72%  { transform: translate(-120%, 30%) translateZ(-40px); }
    100% { transform: translate(-430%, -50%) translateZ(0px); }
  }

  /* ---------- GAME SCREEN ---------- */
  #game-screen {
    display: none;
    height: 100vh;
    width: 100vw;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
  }
  #info {
    margin-top: 10px;
    opacity: 0.7;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    #menu-screen { flex-direction: column; justify-content: center; gap: 40px; padding: 0 20px; }
    .title { font-size: 18vw; }
    .play-btn { font-size: 5vw; }
    .menu-right { width: 90vw; height: 40vh; }
  }
</style>
</head>
<body>

<div id="menu-screen">
  <div class="menu-left">
    <h1 class="title">PONG</h1>
    <button id="play-btn" class="play-btn">PLAY</button>
  </div>
  <div class="menu-right">
    <div class="scene">
      <div class="court"></div>
      <div class="paddle paddle-left"></div>
      <div class="paddle paddle-right"></div>
      <div class="ball"></div>
    </div>
  </div>
</div>

<div id="game-screen">
  <canvas id="pong" width="800" height="500"></canvas>
  <div id="info">W/S — left paddle &nbsp;|&nbsp; ↑/↓ — right paddle &nbsp;|&nbsp; first to 7 wins &nbsp;|&nbsp; Space to restart</div>
</div>

<script>
const menuScreen = document.getElementById('menu-screen');
const gameScreen = document.getElementById('game-screen');
const playBtn = document.getElementById('play-btn');

const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');

const W = canvas.width, H = canvas.height;
const PADDLE_W = 12, PADDLE_H = 90, PADDLE_SPEED = 6;
const BALL_SIZE = 12;
const WIN_SCORE = 7;

let left = { x: 20, y: H/2 - PADDLE_H/2, dy: 0, score: 0 };
let right = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2, dy: 0, score: 0 };
let ball = resetBall();

let keys = {};
let gameOver = false;
let running = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && gameOver) restart();
});
document.addEventListener('keyup', e => keys[e.key] = false);

playBtn.addEventListener('click', () => {
  menuScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  if (!running) {
    running = true;
    loop();
  }
});

function resetBall(direction) {
  const angle = (Math.random() * 0.6 - 0.3);
  const dir = direction || (Math.random() > 0.5 ? 1 : -1);
  const speed = 6;
  return {
    x: W/2 - BALL_SIZE/2,
    y: H/2 - BALL_SIZE/2,
    dx: Math.cos(angle) * speed * dir,
    dy: Math.sin(angle) * speed
  };
}

function restart() {
  left.score = 0;
  right.score = 0;
  ball = resetBall();
  gameOver = false;
}

function update() {
  if (gameOver) return;

  left.dy = 0;
  if (keys['w'] || keys['W']) left.dy = -PADDLE_SPEED;
  if (keys['s'] || keys['S']) left.dy = PADDLE_SPEED;

  right.dy = 0;
  if (keys['ArrowUp']) right.dy = -PADDLE_SPEED;
  if (keys['ArrowDown']) right.dy = PADDLE_SPEED;

  left.y += left.dy;
  right.y += right.dy;

  left.y = Math.max(0, Math.min(H - PADDLE_H, left.y));
  right.y = Math.max(0, Math.min(H - PADDLE_H, right.y));

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
    ball.dy *= -1;
    ball.y = Math.max(0, Math.min(H - BALL_SIZE, ball.y));
  }

  if (ball.x <= left.x + PADDLE_W &&
      ball.x >= left.x &&
      ball.y + BALL_SIZE >= left.y &&
      ball.y <= left.y + PADDLE_H) {
    ball.x = left.x + PADDLE_W;
    const relativeY = (ball.y + BALL_SIZE/2 - (left.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(12, Math.hypot(ball.dx, ball.dy) * 1.05);
    ball.dx = Math.abs(Math.cos(relativeY * 0.9) * speed);
    ball.dy = Math.sin(relativeY * 0.9) * speed;
  }

  if (ball.x + BALL_SIZE >= right.x &&
      ball.x + BALL_SIZE <= right.x + PADDLE_W &&
      ball.y + BALL_SIZE >= right.y &&
      ball.y <= right.y + PADDLE_H) {
    ball.x = right.x - BALL_SIZE;
    const relativeY = (ball.y + BALL_SIZE/2 - (right.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(12, Math.hypot(ball.dx, ball.dy) * 1.05);
    ball.dx = -Math.abs(Math.cos(relativeY * 0.9) * speed);
    ball.dy = Math.sin(relativeY * 0.9) * speed;
  }

  if (ball.x < -BALL_SIZE) {
    right.score++;
    ball = resetBall(1);
  }
  if (ball.x > W) {
    left.score++;
    ball = resetBall(-1);
  }

  if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = '#333';
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#fff';
  ctx.fillRect(left.x, left.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

  ctx.font = '48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(left.score, W/2 - 60, 60);
  ctx.fillText(right.score, W/2 + 60, 60);

  if (gameOver) {
    ctx.font = '36px monospace';
    const winner = left.score > right.score ? 'Left' : 'Right';
    ctx.fillText(winner + ' wins! Press Space', W/2, H/2);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
