<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  /* ---------- MENU SCREEN ---------- */
  #menu-screen {
    display: flex;
    height: 100vh;
    width: 100vw;
    align-items: center;
    justify-content: space-between;
    padding: 0 6vw;
  }

  .menu-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  .title {
    font-size: 9vw;
    font-weight: bold;
    letter-spacing: 6px;
    margin: 0;
    line-height: 0.95;
    text-shadow: 0 0 25px rgba(255,255,255,0.35);
  }

  .play-btn {
    background: transparent;
    color: #fff;
    border: 3px solid #fff;
    font-family: inherit;
    font-size: 2.2vw;
    letter-spacing: 4px;
    padding: 18px 50px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .play-btn:hover {
    background: #fff;
    color: #000;
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
  }

  .menu-right {
    perspective: 1400px;
    width: 55vw;
    height: 78vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 680px;
    height: 480px;
    max-width: 90%;
    max-height: 90%;
    transform-style: preserve-3d;
    animation: rotateScene 20s linear infinite;
  }

  @keyframes rotateScene {
    from { transform: rotateX(58deg) rotateY(0deg); }
    to   { transform: rotateX(58deg) rotateY(360deg); }
  }

  /* ---- paddle: real 3D rectangular prism, 6 faces ---- */
  .paddle-pos {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 100px;
    transform-style: preserve-3d;
  }
  .paddle-pos-left  { left: 30px; }
  .paddle-pos-right { right: 30px; }

  .paddle-box {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    top: 0;
    left: 0;
    width: 16px;
    height: 100px;
    box-shadow: 0 0 18px rgba(255,255,255,0.35);
  }
  .face.front  { background: linear-gradient(135deg, #ffffff 0%, #e4e4e4 100%); transform: translateZ(8px); overflow: hidden; }
  .face.back   { background: #6f6f6f; transform: rotateY(180deg) translateZ(8px); }
  .face.right  { background: #b8b8b8; transform: rotateY(90deg) translateZ(8px); }
  .face.left   { background: #9a9a9a; transform: rotateY(-90deg) translateZ(8px); }
  .face.top    { width: 16px; height: 16px; top: 42px; left: 0; background: #ffffff; transform: rotateX(90deg) translateZ(50px); }
  .face.bottom { width: 16px; height: 16px; top: 42px; left: 0; background: #4a4a4a; transform: rotateX(-90deg) translateZ(50px); }

  .face.front::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,0.95) 48%, transparent 65%);
    mix-blend-mode: overlay;
    animation: glare 20s linear infinite;
  }
  @keyframes glare {
    0%   { transform: translateX(-160%); opacity: 1; }
    45%  { transform: translateX(160%); opacity: 0.15; }
    50%  { transform: translateX(160%); opacity: 0.15; }
    95%  { transform: translateX(-160%); opacity: 1; }
    100% { transform: translateX(-160%); opacity: 1; }
  }

  /* ---- ball: true 3D orb, three intersecting shaded discs that rotate with the scene ---- */
  .ball-pos {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .ball-ring {
    position: absolute;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffffff 22%, #d4d4d4 50%, #6a6a6a 90%);
    box-shadow: 0 0 24px rgba(255,255,255,0.9);
  }
  .ball-ring.xz { transform: rotateX(90deg); }
  .ball-ring.yz { transform: rotateY(90deg); }

  /* ---------- GAME SCREEN ---------- */
  #game-screen {
    display: none;
    height: 100vh;
    width: 100vw;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
  }
  #info {
    margin-top: 10px;
    opacity: 0.7;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    #menu-screen { flex-direction: column; justify-content: center; gap: 40px; padding: 0 20px; }
    .title { font-size: 18vw; }
    .play-btn { font-size: 5vw; }
    .menu-right { width: 90vw; height: 40vh; }
  }
</style>
</head>
<body>

<div id="menu-screen">
  <div class="menu-left">
    <h1 class="title">PONG</h1>
    <button id="play-btn" class="play-btn">PLAY</button>
  </div>
  <div class="menu-right">
    <div class="scene" id="scene">
      <div class="paddle-pos paddle-pos-left" id="paddleLeftPos">
        <div class="paddle-box">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
        </div>
      </div>
      <div class="paddle-pos paddle-pos-right" id="paddleRightPos">
        <div class="paddle-box">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
        </div>
      </div>
      <div class="ball-pos" id="ballPos">
        <div class="ball-ring xy"></div>
        <div class="ball-ring xz"></div>
        <div class="ball-ring yz"></div>
      </div>
    </div>
  </div>
</div>

<div id="game-screen">
  <canvas id="pong" width="800" height="500"></canvas>
  <div id="info">W/S — left paddle &nbsp;|&nbsp; ↑/↓ — right paddle &nbsp;|&nbsp; first to 7 wins &nbsp;|&nbsp; Space to restart</div>
</div>

<script>
// ---- Menu demo physics: ball bounces between paddles, paddles track the ball ----
(function() {
  const paddleLeftPos = document.getElementById('paddleLeftPos');
  const paddleRightPos = document.getElementById('paddleRightPos');
  const ballPos = document.getElementById('ballPos');

  const X_RANGE = 300;   // distance from center to each paddle's contact x
  const Y_RANGE = 165;   // vertical travel limit
  const LEFT_Z = 15, RIGHT_Z = -15;
  const PADDLE_SPEED = 2.4;

  let ball = { x: -X_RANGE, y: 0, dx: 1.6, dy: 0.5 };
  let padL = { y: 0 };
  let padR = { y: 0 };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function demoStep() {
    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.y > Y_RANGE || ball.y < -Y_RANGE) {
      ball.dy *= -1;
      ball.y = clamp(ball.y, -Y_RANGE, Y_RANGE);
    }

    // paddles chase the ball's y position
    padL.y += clamp(ball.y - padL.y, -PADDLE_SPEED, PADDLE_SPEED);
    padR.y += clamp(ball.y - padR.y, -PADDLE_SPEED, PADDLE_SPEED);
    padL.y = clamp(padL.y, -Y_RANGE, Y_RANGE);
    padR.y = clamp(padR.y, -Y_RANGE, Y_RANGE);

    // bounce off paddles
    if (ball.x <= -X_RANGE && ball.dx < 0) {
      ball.dx *= -1;
      ball.x = -X_RANGE;
      ball.dy = clamp(ball.dy + (ball.y - padL.y) * 0.04, -3, 3);
    }
    if (ball.x >= X_RANGE && ball.dx > 0) {
      ball.dx *= -1;
      ball.x = X_RANGE;
      ball.dy = clamp(ball.dy + (ball.y - padR.y) * 0.04, -3, 3);
    }

    // depth arc: interpolate between paddle depths, bulge toward camera mid-flight
    const frac = (ball.x + X_RANGE) / (X_RANGE * 2);
    const baseZ = LEFT_Z + (RIGHT_Z - LEFT_Z) * frac;
    const bulge = Math.sin(frac * Math.PI) * 45;
    const z = baseZ + bulge;

    ballPos.style.transform = `translate(calc(-50% + ${ball.x}px), calc(-50% + ${ball.y}px)) translateZ(${z}px)`;
    paddleLeftPos.style.transform = `translateY(calc(-50% + ${padL.y}px)) translateZ(${LEFT_Z}px)`;
    paddleRightPos.style.transform = `translateY(calc(-50% + ${padR.y}px)) translateZ(${RIGHT_Z}px)`;

    requestAnimationFrame(demoStep);
  }

  demoStep();
})();
</script>
<script>
const menuScreen = document.getElementById('menu-screen');
const gameScreen = document.getElementById('game-screen');
const playBtn = document.getElementById('play-btn');

const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');

const W = canvas.width, H = canvas.height;
const PADDLE_W = 12, PADDLE_H = 90, PADDLE_SPEED = 6;
const BALL_SIZE = 12;
const WIN_SCORE = 7;

let left = { x: 20, y: H/2 - PADDLE_H/2, dy: 0, score: 0 };
let right = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2, dy: 0, score: 0 };
let ball = resetBall();

let keys = {};
let gameOver = false;
let running = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && gameOver) restart();
});
document.addEventListener('keyup', e => keys[e.key] = false);

playBtn.addEventListener('click', () => {
  menuScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  if (!running) {
    running = true;
    loop();
  }
});

function resetBall(direction) {
  const angle = (Math.random() * 0.6 - 0.3);
  const dir = direction || (Math.random() > 0.5 ? 1 : -1);
  const speed = 6;
  return {
    x: W/2 - BALL_SIZE/2,
    y: H/2 - BALL_SIZE/2,
    dx: Math.cos(angle) * speed * dir,
    dy: Math.sin(angle) * speed
  };
}

function restart() {
  left.score = 0;
  right.score = 0;
  ball = resetBall();
  gameOver = false;
}

function update() {
  if (gameOver) return;

  left.dy = 0;
  if (keys['w'] || keys['W']) left.dy = -PADDLE_SPEED;
  if (keys['s'] || keys['S']) left.dy = PADDLE_SPEED;

  right.dy = 0;
  if (keys['ArrowUp']) right.dy = -PADDLE_SPEED;
  if (keys['ArrowDown']) right.dy = PADDLE_SPEED;

  left.y += left.dy;
  right.y += right.dy;

  left.y = Math.max(0, Math.min(H - PADDLE_H, left.y));
  right.y = Math.max(0, Math.min(H - PADDLE_H, right.y));

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
    ball.dy *= -1;
    ball.y = Math.max(0, Math.min(H - BALL_SIZE, ball.y));
  }

  if (ball.x <= left.x + PADDLE_W &&
      ball.x >= left.x &&
      ball.y + BALL_SIZE >= left.y &&
      ball.y <= left.y + PADDLE_H) {
    ball.x = left.x + PADDLE_W;
    const relativeY = (ball.y + BALL_SIZE/2 - (left.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(12, Math.hypot(ball.dx, ball.dy) * 1.05);
    ball.dx = Math.abs(Math.cos(relativeY * 0.9) * speed);
    ball.dy = Math.sin(relativeY * 0.9) * speed;
  }

  if (ball.x + BALL_SIZE >= right.x &&
      ball.x + BALL_SIZE <= right.x + PADDLE_W &&
      ball.y + BALL_SIZE >= right.y &&
      ball.y <= right.y + PADDLE_H) {
    ball.x = right.x - BALL_SIZE;
    const relativeY = (ball.y + BALL_SIZE/2 - (right.y + PADDLE_H/2)) / (PADDLE_H/2);
    const speed = Math.min(12, Math.hypot(ball.dx, ball.dy) * 1.05);
    ball.dx = -Math.abs(Math.cos(relativeY * 0.9) * speed);
    ball.dy = Math.sin(relativeY * 0.9) * speed;
  }

  if (ball.x < -BALL_SIZE) {
    right.score++;
    ball = resetBall(1);
  }
  if (ball.x > W) {
    left.score++;
    ball = resetBall(-1);
  }

  if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = '#333';
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#fff';
  ctx.fillRect(left.x, left.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

  ctx.font = '48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(left.score, W/2 - 60, 60);
  ctx.fillText(right.score, W/2 + 60, 60);

  if (gameOver) {
    ctx.font = '36px monospace';
    const winner = left.score > right.score ? 'Left' : 'Right';
    ctx.fillText(winner + ' wins! Press Space', W/2, H/2);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
